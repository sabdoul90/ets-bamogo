version: "3.9"

services:
  frontend_bamogo_app:
    container_name: frontend_bamogo_app

    build:
      context: .
      dockerfile: Dockerfile

    image: frontend_bamogo_app:latest

    ports:
      - "3001:3000"

    env_file:
      - .env

    volumes:
      - frontend_bamogo_app_data:/app/.next/cache

    restart: unless-stopped

    networks:
      - frontend-bamogo-app-net

volumes:
  frontend_bamogo_app_data:

networks:
  frontend-bamogo-app-net:
    driver: bridge